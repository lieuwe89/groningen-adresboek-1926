# Copy to /srv/apps/groningen-1854/docker-compose.yml on the VPS.
services:
  app:
    image: ghcr.io/lieuwe89/groningen-adresboek-1926:1854
    container_name: groningen-1854
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3007:3000"
    volumes:
      - /srv/data/groningen-1854:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/sections"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
