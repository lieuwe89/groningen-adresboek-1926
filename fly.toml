app = "groningen-1926"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/adresboek.sqlite"
  JSON_DIR = "/data/json"
  OVERRIDES_DIR = "/data/overrides"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "30s"
    interval = "10s"
    timeout = "8s"
    method = "GET"
    path = "/info"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "groningen_data"
  destination = "/data"
  initial_size = "3gb"
