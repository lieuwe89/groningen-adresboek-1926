<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groningen 1926 — Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Special+Elite&display=swap" crossorigin>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #182d5c; overflow: hidden; }
#root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const BP = {
  blue:      '#182d5c',
  blueMid:   '#1a3060',
  ink:       '#cfc39a',
  inkBright: '#e6d9b0',
  inkDim:    '#7a7054',
  inkFaint:  '#cfc39a18',
  amber:     '#e8b84c',
  amberDim:  '#e8b84c18',
  paper:     '#f0e8d4',
  paperInk:  '#1a1208',
  font:      '"Josefin Sans", sans-serif',
  hand:      '"Special Elite", cursive',
};

const RESULTS = [
  { name: 'Balk, M.E. (Mej.)', occ: 'Verpleegster',       addr: 'Praediniussingel 6',        page: 136, active: true },
  { name: 'Balk, P.',          occ: 'Koopman',             addr: 'Van Julsingastraat 29',     page: 137 },
  { name: 'Balkema, J.',       occ: 'Metselaar',           addr: 'Gr. Kruisstraat 24',        page: 137 },
  { name: 'Balker, G.H.',      occ: 'Chauffeur',           addr: 'Oosterhamriklaan 3',        page: 138 },
  { name: 'Ballast, A.',       occ: 'Gemeentearbeider',    addr: 'Nieuwe Boteringestr. 48',   page: 138 },
  { name: 'Baller, H.R.',      occ: 'Klerk',               addr: 'Korreweg 112',              page: 138 },
  { name: 'Balm, C.',          occ: 'Fabrieksarbeider',    addr: 'Verlengde Hereweg 7',       page: 138 },
];

const MARKERS = [
  { x: 240, y: 200, active: true,  person: RESULTS[0] },
  { x: 310, y: 175, count: 4 },
  { x: 170, y: 310, count: 2 },
  { x: 390, y: 140, person: RESULTS[3] },
  { x: 380, y: 310, person: RESULTS[4] },
  { x: 110, y: 215, person: RESULTS[5] },
];

/* ── Tiny helpers ── */
const Label = ({ children, color, style = {} }) => (
  <div style={{ fontFamily: BP.font, color: color || BP.inkDim, fontSize: 9, letterSpacing: '0.2em', textTransform: 'uppercase', fontWeight: 600, ...style }}>
    {children}
  </div>
);

const Rule = ({ opacity = 0.25 }) => (
  <div style={{ height: '0.5px', background: BP.ink, opacity }} />
);

/* ── Map panel: real 1926 map + blueprint overlay ── */
function BPMap({ width, height, onMarkerClick, activeLayer, onLayerToggle }) {
  const ink = BP.ink;
  const amber = BP.amber;

  const [zoom, setZoom] = React.useState(2.6);
  const [pan, setPan] = React.useState({ x: -38, y: -42 });
  const dragging = React.useRef(null);

  const onMouseDown = (e) => {
    dragging.current = { ox: e.clientX - pan.x, oy: e.clientY - pan.y };
    e.preventDefault();
  };
  const onMouseMove = (e) => {
    if (!dragging.current) return;
    setPan({ x: e.clientX - dragging.current.ox, y: e.clientY - dragging.current.oy });
  };
  const onMouseUp = () => { dragging.current = null; };

  const zoomIn  = (e) => { e.stopPropagation(); setZoom(z => Math.min(+(z + 0.4).toFixed(1), 6)); };
  const zoomOut = (e) => { e.stopPropagation(); setZoom(z => Math.max(+(z - 0.4).toFixed(1), 1)); };
  const reset   = (e) => { e.stopPropagation(); setZoom(2.6); setPan({ x: -38, y: -42 }); };

  const btnStyle = (extra = {}) => ({
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    width: 28, height: 28,
    border: `1px solid ${BP.amber}88`,
    background: BP.blue + 'ee',
    color: BP.amber,
    fontFamily: BP.font,
    fontSize: 14, fontWeight: 700,
    cursor: 'pointer',
    letterSpacing: 0,
    userSelect: 'none',
    ...extra,
  });

  return (
    <div
      style={{ position: 'absolute', inset: 0, overflow: 'hidden', cursor: dragging.current ? 'grabbing' : 'grab' }}
      onMouseDown={onMouseDown}
      onMouseMove={onMouseMove}
      onMouseUp={onMouseUp}
      onMouseLeave={onMouseUp}
    >
      {/* Real 1926 Groningen map */}
      <img
        src="assets/map_1926.jpg"
        alt="Plattegrond van Groningen 1926"
        draggable={false}
        style={{
          position: 'absolute',
          width: '100%', height: '100%',
          objectFit: 'cover',
          transformOrigin: 'center center',
          transform: `scale(${zoom}) translate(${pan.x / zoom}px, ${pan.y / zoom}px)`,
          filter: 'sepia(15%) brightness(0.9) saturate(0.85)',
          userSelect: 'none',
          transition: dragging.current ? 'none' : 'transform 0.15s ease-out',
        }}
      />

      {/* Blueprint overlay: grid + ticks + markers + callout */}
      <svg width={width} height={height} style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
        <defs>
          <pattern id="g1" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0L0 0 0 40" fill="none" stroke={ink} strokeWidth="0.3" opacity="0.12"/>
          </pattern>
          <pattern id="g5" width="200" height="200" patternUnits="userSpaceOnUse">
            <path d="M200 0L0 0 0 200" fill="none" stroke={ink} strokeWidth="0.7" opacity="0.16"/>
          </pattern>
        </defs>
        <rect width={width} height={height} fill="url(#g1)"/>
        <rect width={width} height={height} fill="url(#g5)"/>

        {/* Dimension ticks */}
        {[.1,.2,.3,.4,.5,.6,.7,.8,.9].map(t => (
          <React.Fragment key={t}>
            <line x1={t*width} y1={0}      x2={t*width}   y2={7}        stroke={ink} strokeWidth="0.7" opacity="0.5"/>
            <line x1={t*width} y1={height} x2={t*width}   y2={height-7} stroke={ink} strokeWidth="0.7" opacity="0.5"/>
            <line x1={0}       y1={t*height} x2={7}        y2={t*height} stroke={ink} strokeWidth="0.7" opacity="0.5"/>
            <line x1={width}   y1={t*height} x2={width-7}  y2={t*height} stroke={ink} strokeWidth="0.7" opacity="0.5"/>
          </React.Fragment>
        ))}

        {/* Scale bar */}
        {[0,1,2,3,4].map(i => (
          <rect key={i} x={16+i*18} y={height-22} width={18} height={5}
            fill={i%2===0 ? ink : 'none'} stroke={ink} strokeWidth="0.6" opacity="0.7"/>
        ))}
        <text x={16}  y={height-10} fill={ink} fontSize="7" fontFamily={BP.font} letterSpacing="0.12em" opacity="0.7">0</text>
        <text x={106} y={height-10} fill={ink} fontSize="7" fontFamily={BP.font} letterSpacing="0.12em" opacity="0.7">500 M</text>

        {/* Markers */}
        {MARKERS.map((m, i) => (
          <g key={i} transform={`translate(${m.x},${m.y})`}
            style={{ cursor: (m.count || m.person) ? 'pointer' : 'default', pointerEvents: 'all' }}
            onClick={(e) => { e.stopPropagation(); if (m.person) onMarkerClick(m.person); }}
          >
            {m.count ? (
              <>
                <rect x="-14" y="-14" width="28" height="28" fill={BP.blue+'cc'} stroke={amber} strokeWidth="1.2" opacity="0.9"/>
                <line x1="-18" y1="0" x2="-14" y2="0" stroke={amber} strokeWidth="0.7" opacity="0.7"/>
                <line x1="14"  y1="0" x2="18"  y2="0" stroke={amber} strokeWidth="0.7" opacity="0.7"/>
                <line x1="0" y1="-18" x2="0" y2="-14" stroke={amber} strokeWidth="0.7" opacity="0.7"/>
                <line x1="0" y1="14"  x2="0" y2="18"  stroke={amber} strokeWidth="0.7" opacity="0.7"/>
                <text x="0" y="4" textAnchor="middle" fill={amber} fontSize="9" fontFamily={BP.font} fontWeight="700">{m.count}</text>
              </>
            ) : (
              <>
                <rect x="-5" y="-5" width="10" height="10" fill="none" stroke={m.active ? amber : ink} strokeWidth={m.active ? 2 : 0.9} transform="rotate(45)" opacity={m.active ? 1 : 0.6}/>
                {m.active && <>
                  <rect x="-9" y="-9" width="18" height="18" fill="none" stroke={amber} strokeWidth="0.6" transform="rotate(45)" opacity="0.4"/>
                  <line x1="-24" y1="0" x2="-9" y2="0" stroke={amber} strokeWidth="0.5" opacity="0.55" strokeDasharray="3,3"/>
                  <line x1="9"   y1="0" x2="24" y2="0" stroke={amber} strokeWidth="0.5" opacity="0.55" strokeDasharray="3,3"/>
                </>}
              </>
            )}
          </g>
        ))}

        {/* Active callout */}
        <g transform="translate(240,196)">
          <rect x="-5" y="-56" width="192" height="54" fill={BP.blue+'ee'} stroke={amber} strokeWidth="1"/>
          <rect x="-3" y="-54" width="188" height="50" fill="none" stroke={amber} strokeWidth="0.3" opacity="0.35"/>
          <text x="5" y="-38" fill={amber}        fontSize="7.5"  fontFamily={BP.font} letterSpacing="0.18em" fontWeight="700">PRAEDINIUSSINGEL 6</text>
          <text x="5" y="-24" fill={BP.inkBright} fontSize="9.5"  fontFamily={BP.font} letterSpacing="0.06em">Balk, M.E. (Mej.)</text>
          <text x="5" y="-12" fill={BP.inkDim}    fontSize="8"    fontFamily={BP.font} letterSpacing="0.06em">Verpleegster</text>
          <line x1="0" y1="0" x2="0" y2="-3" stroke={amber} strokeWidth="1"/>
        </g>
      </svg>

      {/* Zoom / nav buttons — bottom right */}
      <div style={{ position: 'absolute', bottom: 16, right: 16, display: 'flex', flexDirection: 'column', gap: 2, zIndex: 10 }}>
        <div onClick={zoomIn}  style={btnStyle()}>+</div>
        <div onClick={reset}   style={btnStyle({ fontSize: 9, letterSpacing: '0.1em', height: 22 })}>⌖</div>
        <div onClick={zoomOut} style={btnStyle()}>−</div>
      </div>

      {/* Zoom level indicator */}
      <div style={{ position: 'absolute', bottom: 16, right: 56, zIndex: 10, display: 'flex', alignItems: 'center' }}>
        <div style={{ border: `1px solid ${BP.amber}55`, background: BP.blue+'ee', padding: '3px 8px' }}>
          <span style={{ color: BP.inkDim, fontFamily: BP.font, fontSize: 8, letterSpacing: '0.14em' }}>
            Z {zoom.toFixed(1)}×
          </span>
        </div>
      </div>

      {/* Layer selector — bottom left */}
      <div style={{ position: 'absolute', bottom: 16, left: 16, zIndex: 10, display: 'flex', flexDirection: 'column', gap: 1 }}>
        <div style={{ border: `1px solid ${BP.ink}44`, background: BP.blue+'cc', padding: '3px 10px', marginBottom: 2 }}>
          <Label color={BP.amber}>Kaartlagen</Label>
        </div>
        {[
          { id: 'historisch', label: '1926 — Historisch', alwaysOn: true },
          { id: 'straten',    label: 'Straten &amp; namen' },
          { id: 'adressen',   label: 'Adresmarkeringen' },
          { id: 'modern',     label: 'Modern overlay' },
        ].map(layer => {
          const on = activeLayer[layer.id] !== false;
          return (
            <div key={layer.id}
              onClick={(e) => { e.stopPropagation(); if (!layer.alwaysOn) onLayerToggle(layer.id); }}
              style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 10px', border: `1px solid ${on ? BP.amber+'66' : BP.ink+'33'}`, background: on ? BP.amber+'0d' : BP.blue+'bb', cursor: layer.alwaysOn ? 'default' : 'pointer' }}>
              {/* Checkbox */}
              <div style={{ width: 9, height: 9, border: `1px solid ${on ? BP.amber : BP.inkDim}`, background: on ? BP.amber : 'transparent', flexShrink: 0 }}/>
              <span style={{ color: on ? BP.inkBright : BP.inkDim, fontFamily: BP.font, fontSize: 8.5, letterSpacing: '0.1em' }}
                dangerouslySetInnerHTML={{ __html: layer.label }}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── Search Panel component ── */
function SearchPanel({ width, onClose }) {
  return (
    <div style={{ width, height: '100%', borderRight: `1px solid ${BP.ink}88`, display: 'flex', flexDirection: 'column', background: BP.blue }}>
      <div style={{ padding: '5px 14px 4px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <Label color={BP.amber}>§ 1  —  Zoekregister</Label>
        <div onClick={onClose} style={{ color: BP.inkDim, fontSize: 10, cursor: 'pointer', padding: '2px 4px' }}>✕</div>
      </div>
      <Rule opacity={0.2}/>
      <div style={{ padding: '11px 13px' }}>
        <div style={{ border: `1px solid ${BP.amber}88`, padding: '8px 11px', display: 'flex', alignItems: 'center', gap: 8, background: `${BP.amber}08`, position: 'relative' }}>
          {[['-1px','-1px'],['auto','-1px'],['-1px','auto'],['auto','auto']].map(([t,b],i) => (
            <div key={i} style={{ position:'absolute', top:t==='auto'?'auto':t, bottom:b==='auto'?'auto':b, left:i%2===0?'-1px':'auto', right:i%2===1?'-1px':'auto', width:5, height:5, border:`1px solid ${BP.amber}`, background:BP.blue }}/>
          ))}
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke={BP.amber} strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span style={{ color: BP.amber, fontSize: 11.5, letterSpacing: '0.12em' }}>BALK</span>
          <div style={{ width: 1.5, height: 13, background: BP.amber, marginLeft: 1 }}/>
        </div>
      </div>
      <Rule opacity={0.18}/>
      <div style={{ padding: '8px 13px', display: 'flex', gap: 3 }}>
        {['Alle','Namen','Straten','Beroepen'].map((f, i) => (
          <div key={f} style={{ flex:1, padding:'4px 0', textAlign:'center', border:`1px solid ${i===0 ? BP.amber+'88' : BP.inkDim+'44'}`, color:i===0 ? BP.amber : BP.inkDim, fontSize:8, letterSpacing:'0.12em', fontWeight:700, background:i===0 ? `${BP.amber}10` : 'transparent', cursor:'pointer' }}>{f.toUpperCase()}</div>
        ))}
      </div>
      <Rule opacity={0.15}/>
      <div style={{ padding: '5px 13px 4px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <Label>Resultaten</Label>
        <span style={{ color: BP.amber, fontSize: 10, letterSpacing: '0.1em', fontWeight: 700 }}>28</span>
      </div>
      <Rule opacity={0.15}/>
      <div style={{ flex: 1, overflowY: 'auto' }}>
        {RESULTS.map((r, i) => (
          <div key={i} style={{ padding:'10px 13px', borderBottom:`0.5px solid ${BP.ink}20`, background:r.active?`${BP.amber}0c`:'transparent', borderLeft:`2px solid ${r.active ? BP.amber : 'transparent'}`, cursor:'pointer' }}>
            <div style={{ color:r.active?BP.amber:BP.inkBright, fontSize:11, fontWeight:r.active?700:400, letterSpacing:'0.08em', marginBottom:3 }}>{r.name}</div>
            <div style={{ color:BP.inkDim, fontSize:8.5, letterSpacing:'0.08em', marginBottom:5 }}>{r.occ}</div>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span style={{ color:r.active?BP.amber:BP.inkDim, fontSize:8.5 }}>{r.addr}</span>
              <span style={{ color:BP.inkDim, fontSize:8, border:`0.5px solid ${BP.inkDim}55`, padding:'1px 5px', letterSpacing:'0.08em' }}>P.{r.page}</span>
            </div>
          </div>
        ))}
      </div>
      <Rule opacity={0.2}/>
      <div style={{ padding: '5px 13px' }}><Label>Afd. I — Persoonsgegevens</Label></div>
    </div>
  );
}

/* ── Scan Panel component ── */
function ScanPanel({ width, onClose, person }) {
  const p = person || RESULTS[0];
  return (
    <div style={{ width, height: '100%', borderLeft: `1px solid ${BP.ink}88`, display: 'flex', flexDirection: 'column', background: BP.blue }}>
      <div style={{ padding: '5px 13px 4px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <Label color={BP.amber}>§ 3  —  Originele Scan</Label>
        <div onClick={onClose} style={{ color: BP.inkDim, fontSize: 10, cursor: 'pointer', padding: '2px 4px', lineHeight: 1 }}>✕</div>
      </div>
      <Rule opacity={0.2}/>
      <div style={{ padding: '9px 13px', display: 'flex', flexDirection: 'column', gap: 4 }}>
        <div style={{ color: BP.inkDim, fontSize: 8, letterSpacing: '0.16em', fontWeight: 600 }}>Alphabetisch Naamregister</div>
        <div style={{ color: BP.amber, fontSize: 12, letterSpacing: '0.16em', fontWeight: 700 }}>Pagina {p.page}</div>
        <div style={{ display: 'flex', gap: 16, marginTop: 2 }}>
          <div>
            <div style={{ color: BP.inkDim, fontSize: 7.5, letterSpacing: '0.14em', marginBottom: 2 }}>NAAM</div>
            <div style={{ color: BP.inkBright, fontSize: 10, letterSpacing: '0.08em' }}>{p.name}</div>
          </div>
          <div>
            <div style={{ color: BP.inkDim, fontSize: 7.5, letterSpacing: '0.14em', marginBottom: 2 }}>BEROEP</div>
            <div style={{ color: BP.inkBright, fontSize: 10, letterSpacing: '0.08em' }}>{p.occ}</div>
          </div>
        </div>
        <div style={{ marginTop: 1 }}>
          <div style={{ color: BP.inkDim, fontSize: 7.5, letterSpacing: '0.14em', marginBottom: 2 }}>ADRES</div>
          <div style={{ color: BP.amber, fontSize: 10, letterSpacing: '0.1em' }}>{p.addr}</div>
        </div>
      </div>
      <Rule opacity={0.2}/>
      <div style={{ flex: 1, background: BP.paper, overflow: 'hidden', position: 'relative' }}>
        <img src="assets/scan_136.jpg" alt="Adresboek Groningen 1926 — pagina 136"
          style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition:'top left', display:'block' }}/>
        <div style={{ position:'absolute', top:'9%', left:'5%', width:'45%', height:'1.9%', background:`${BP.amber}44`, border:`1px solid ${BP.amber}`, pointerEvents:'none' }}/>
        <svg style={{ position:'absolute', inset:0, pointerEvents:'none', zIndex:3 }} width="100%" height="100%">
          <line x1="4" y1="12" x2="4" y2="4" stroke={BP.blue} strokeWidth="1" opacity="0.5"/>
          <line x1="4" y1="4" x2="12" y2="4" stroke={BP.blue} strokeWidth="1" opacity="0.5"/>
        </svg>
      </div>
      <Rule opacity={0.2}/>
      <div style={{ padding: '8px 13px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ color:BP.inkDim, fontSize:9.5, cursor:'pointer', letterSpacing:'0.1em', display:'flex', alignItems:'center', gap:5 }}>
          <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="m15 18-6-6 6-6"/></svg>{p.page - 1}
        </div>
        <Label>Blz {p.page} / 412</Label>
        <div style={{ color:BP.inkDim, fontSize:9.5, cursor:'pointer', letterSpacing:'0.1em', display:'flex', alignItems:'center', gap:5 }}>
          {p.page + 1}<svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   MAIN COMPONENT
══════════════════════════════════════════════════════════ */
function App() {
  const [searchOpen, setSearchOpen] = React.useState(true);
  const [scanOpen,   setScanOpen]   = React.useState(true);
  const [activePerson, setActivePerson] = React.useState(RESULTS[0]);
  const [layers, setLayers] = React.useState({ historisch: true, straten: true, adressen: true, modern: false });

  const SEARCH_W = 295;
  const SCAN_W   = 325;
  const DUR      = '320ms';
  const EASE     = 'cubic-bezier(0.25,0.46,0.45,0.94)';

  const handleMarkerClick = (person) => {
    setActivePerson(person);
    setScanOpen(true);
  };

  const handleLayerToggle = (id) => {
    setLayers(prev => ({ ...prev, [id]: !prev[id] }));
  };

  return (
    <div style={{ width: '100%', height: '100%', background: BP.blue, fontFamily: BP.font, display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative' }}>

      {/* Global fine grid */}
      <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 0 }} width="100%" height="100%">
        <defs>
          <pattern id="pg1" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M30 0L0 0 0 30" fill="none" stroke={BP.ink} strokeWidth="0.22" opacity="0.14"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#pg1)"/>
        {/* Outer double border */}
        <rect x="7" y="7" width="calc(100% - 14)" height="calc(100% - 14)" fill="none" stroke={BP.ink} strokeWidth="1" opacity="0.55"/>
        <rect x="12" y="12" width="calc(100% - 24)" height="calc(100% - 24)" fill="none" stroke={BP.ink} strokeWidth="0.4" opacity="0.28"/>
      </svg>

      {/* ── Header / title block ── */}
      <div style={{ padding: '10px 22px 8px', borderBottom: `1px solid ${BP.ink}88`, display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', flexShrink: 0, position: 'relative', zIndex: 1 }}>
        <div>
          <div style={{ color: BP.inkDim, fontSize: 8.5, letterSpacing: '0.22em', marginBottom: 3, fontWeight: 600 }}>
            "GEMEENTE GRONINGEN" — ADRESBOEK
          </div>
          <div style={{ color: BP.amber, fontSize: 15, letterSpacing: '0.28em', fontWeight: 700, lineHeight: 1 }}>
            ADRESBOEK 1926
          </div>
          <div style={{ color: BP.inkBright, fontSize: 8.5, letterSpacing: '0.18em', marginTop: 3, fontWeight: 400 }}>
            INTERACTIEVE VERKENNER — NAAMREGISTER &amp; PLATTEGROND
          </div>
          <div style={{ display: 'flex', gap: 20, marginTop: 5 }}>
            {[['SCHAAL','1 : 5000'],['SECTIE','NAAMREGISTER'],['BLAD','136 / 412']].map(([k,v]) => (
              <div key={k} style={{ display: 'flex', gap: 6, alignItems: 'baseline' }}>
                <span style={{ color: BP.inkDim, fontSize: 7.5, letterSpacing: '0.16em', fontWeight: 600 }}>{k}</span>
                <span style={{ color: BP.ink, fontSize: 8.5, letterSpacing: '0.1em' }}>{v}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 7 }}>
          <div style={{ display: 'flex', gap: 1 }}>
            {['NL','EN'].map((l,i) => (
              <div key={l} style={{ padding: '3px 12px', border: `1px solid ${i===0 ? BP.amber+'99' : BP.inkDim+'55'}`, color: i===0 ? BP.amber : BP.inkDim, fontSize: 9, letterSpacing: '0.18em', fontWeight: 700, cursor: 'pointer' }}>{l}</div>
            ))}
          </div>
          <div style={{ color: BP.inkDim, fontSize: 7.5, letterSpacing: '0.14em', textAlign: 'right' }}>
            53°13′N  6°34′E
          </div>
        </div>
      </div>

      {/* ── Main three-panel layout ── */}
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden', position: 'relative', zIndex: 1 }}>

        {/* ── SEARCH PANEL — push ── */}
        <div style={{ width: searchOpen ? SEARCH_W : 0, overflow: 'hidden', flexShrink: 0, transition: `width ${DUR} ${EASE}` }}>
          <SearchPanel width={SEARCH_W} onClose={() => setSearchOpen(false)}/>
        </div>

        {/* ── MAP ── */}
        <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
          <BPMap width={900} height={700} onMarkerClick={handleMarkerClick} activeLayer={layers} onLayerToggle={handleLayerToggle}/>

          {/* Search toggle button — visible when panel closed */}
          <div
            onClick={() => setSearchOpen(true)}
            style={{
              position: 'absolute', top: 9, left: 13, zIndex: 10,
              opacity: searchOpen ? 0 : 1,
              pointerEvents: searchOpen ? 'none' : 'auto',
              transition: `opacity ${DUR} ${EASE}`,
              display: 'flex', alignItems: 'center', gap: 8,
              border: `1px solid ${BP.amber}88`, background: BP.blue+'ee',
              padding: '5px 12px', cursor: 'pointer',
            }}>
            <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke={BP.amber} strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <Label color={BP.amber}>Zoeken</Label>
          </div>

          {/* Scan toggle button — visible when scan panel closed */}
          <div
            onClick={() => setScanOpen(true)}
            style={{
              position: 'absolute', top: 9, right: 13, zIndex: 10,
              opacity: scanOpen ? 0 : 1,
              pointerEvents: scanOpen ? 'none' : 'auto',
              transition: `opacity ${DUR} ${EASE}`,
              display: 'flex', alignItems: 'center', gap: 8,
              border: `1px solid ${BP.amber}88`, background: BP.blue+'ee',
              padding: '5px 12px', cursor: 'pointer',
            }}>
            <Label color={BP.amber}>Scan</Label>
            <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke={BP.amber} strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </div>

          {/* Map label — only when search panel open */}
          {searchOpen && (
            <div style={{ position: 'absolute', top: 9, left: 13, zIndex: 5 }}>
              <Label color={BP.amber}>§ 2  —  Plattegrond</Label>
            </div>
          )}
        </div>

        {/* ── SCAN PANEL — push ── */}
        <div style={{ width: scanOpen ? SCAN_W : 0, overflow: 'hidden', flexShrink: 0, transition: `width ${DUR} ${EASE}` }}>
          <ScanPanel width={SCAN_W} onClose={() => setScanOpen(false)} person={activePerson}/>
        </div>
      </div>

      {/* ── Footer title block ── */}
      <div style={{ height: 26, borderTop: `1px solid ${BP.ink}88`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 22px', flexShrink: 0, position: 'relative', zIndex: 1 }}>
        <Label>Technisch Bureau — Gemeente Groningen — 1926</Label>
        <Label color={BP.amber}>Nr. Grn/Adr/1926  —  21 Nov. 1926</Label>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
